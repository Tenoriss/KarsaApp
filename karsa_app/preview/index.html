<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KARSA — SD Karitas Purwokerto</title>
  <link rel="icon" type="image/png" href="./assets/images/icon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

      <select id="screen-select" class="screen-select" aria-label="Pilih layar"></select>

    <main id="app-viewport" class="scroll-viewport"></main>
    <nav id="bottom-nav" class="bottom-nav" hidden aria-label="Navigasi utama"></nav>

      <div id="sheet-panel" class="sheet-panel"></div>
    </div>
  </div>
  <script src="./curriculum-data.js"></script>
  <script src="./app.js"></script>

</html>
