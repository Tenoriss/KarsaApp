<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KARSA — SD Karitas Purwokerto</title>
  <!-- Tab baru tidak boleh memakai versi lama dari cache. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#A2D7FB" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/png" href="./assets/images/icon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!--
    Tidak ada bar pengembang di atas: aplikasi harus langsung terlihat seperti
    aplikasi sungguhan. Berpindah layar lewat alur aplikasi (login, bottom nav,
    tombol di dalam layar) atau deep link `#<layar>`.
  -->
  <div id="app-shell" class="app-shell">
    <main id="app-viewport" class="scroll-viewport"></main>
    <nav id="bottom-nav" class="bottom-nav" hidden aria-label="Navigasi utama"></nav>
    <div id="sheet-backdrop" class="sheet-backdrop" hidden>
      <div id="sheet-panel" class="sheet-panel"></div>
    </div>
  </div>
  <noscript>
    <p style="font-family: system-ui, sans-serif; padding: 24px; color: #203E5A">
      Aplikasi KARSA memerlukan JavaScript. Aktifkan JavaScript lalu muat ulang
      halaman ini.
    </p>
  </noscript>
  <script src="./curriculum-data.js"></script>
  <script src="./icon-paths.js"></script>
  <script src="./app.js"></script>
</body>
</html>
